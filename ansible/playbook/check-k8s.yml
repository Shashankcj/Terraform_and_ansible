---
- name: Verify Kubernetes requirements on all nodes
  hosts: kubernetes
  become: true
  gather_facts: false

  tasks:

    - name: Check kubeadm
      ansible.builtin.command: kubeadm version
      register: kubeadm_check
      changed_when: false
      failed_when: false

    - name: Check kubelet
      ansible.builtin.command: kubelet --version
      register: kubelet_check
      changed_when: false
      failed_when: false

    - name: Check kubectl
      ansible.builtin.command: kubectl version --client
      register: kubectl_check
      changed_when: false
      failed_when: false

    - name: Check containerd
      ansible.builtin.command: containerd --version
      register: containerd_check
      changed_when: false
      failed_when: false

    - name: Show results
      ansible.builtin.debug:
        msg:
          - "kubeadm: {{ kubeadm_check.stdout | default('NOT INSTALLED') }}"
          - "kubelet: {{ kubelet_check.stdout | default('NOT INSTALLED') }}"
          - "kubectl: {{ kubectl_check.stdout | default('NOT INSTALLED') }}"
          - "containerd: {{ containerd_check.stdout | default('NOT INSTALLED') }}"