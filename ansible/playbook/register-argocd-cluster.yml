---
- name: Fetch kubeconfig from Kubernetes control plane
  hosts: control_plane
  gather_facts: false
  become: true

  tasks:
    - name: Read Kubernetes admin kubeconfig
      slurp:
        src: /etc/kubernetes/admin.conf
      register: kubeconfig_file

    - name: Save kubeconfig temporarily on Ansible controller
      copy:
        content: "{{ kubeconfig_file.content | b64decode }}"
        dest: "/tmp/{{ inventory_hostname }}-admin.conf"
        mode: "0600"
      delegate_to: localhost
      become: false


- name: Register Kubernetes cluster in Argo CD
  hosts: localhost
  gather_facts: false

  vars:
    argocd_server: "{{ lookup('env', 'ARGOCD_SERVER') }}"
    argocd_username: "{{ lookup('env', 'ARGOCD_USERNAME') }}"
    argocd_password: "{{ lookup('env', 'ARGOCD_PASSWORD') }}"
    cluster_control_planes:
      - "{{ groups['cluster1_control_plane'][0] }}"
      - "{{ groups['cluster2_control_plane'][0] }}"

  tasks:
    - name: Login to Argo CD
      command:
        argv:
          - argocd
          - login
          - "{{ argocd_server }}"
          - --username
          - "{{ argocd_username }}"
          - --password
          - "{{ argocd_password }}"
          - --insecure
      

    - name: Check cluster connectivity
      command:
        argv:
          - kubectl
          - --kubeconfig
          - "/tmp/{{ item }}-admin.conf"
          - get
          - nodes
      loop: "{{ cluster_control_planes }}"
      changed_when: false

    - name: Register cluster with Argo CD
      command:
        argv:
          - argocd
          - cluster
          - add
          - kubernetes-admin@kubernetes
          - --kubeconfig
          - "/tmp/{{ item }}-admin.conf"
          - --name
          - "{{ item }}"
          - --label
          - cluster-type=workload
          - --label
          - "cilium-cluster-id={{ cluster_index + 1 }}"
          - --label
          - "cilium-cluster-name=cluster_{{ cluster_index + 1 }}"
          - --yes
      loop: "{{ cluster_control_planes }}"
      loop_control:
        index_var: cluster_index