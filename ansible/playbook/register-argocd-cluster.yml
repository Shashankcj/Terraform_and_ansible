---
- name: Fetch kubeconfig from Kubernetes control plane
  hosts: control_plane
  gather_facts: false
  become: true

  tasks:
    - name: Read Kubernetes admin kubeconfig
      slurp:
        src: /etc/kubernetes/admin.conf
      register: kubeconfig_file

    - name: Save kubeconfig temporarily on Ansible controller
      copy:
        content: "{{ kubeconfig_file.content | b64decode }}"
        dest: "/tmp/{{ inventory_hostname }}-admin.conf"
        mode: "0600"
      delegate_to: localhost
      become: false


- name: Register Kubernetes cluster in Argo CD
  hosts: localhost
  gather_facts: false

  vars:
    argocd_server: "{{ lookup('env', 'ARGOCD_SERVER') }}"
    argocd_username: "{{ lookup('env', 'ARGOCD_USERNAME') }}"
    argocd_password: "{{ lookup('env', 'ARGOCD_PASSWORD') }}"
    cluster_name: "{{ groups['control_plane'][0] }}"
    kubeconfig_path: "/tmp/{{ groups['control_plane'][0] }}-admin.conf"

  tasks:

    - name: Login to Argo CD
      command:
        argv:
          - argocd
          - login
          - "{{ argocd_server }}"
          - --username
          - "{{ argocd_username }}"
          - --password
          - "{{ argocd_password }}"
          - --insecure
      no_log: true

    - name: Check cluster connectivity
      command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ kubeconfig_path }}"
          - get
          - nodes
      changed_when: false

    - name: Register cluster with Argo CD
      command:
        argv:
          - argocd
          - cluster
          - add
          - kubernetes-admin@kubernetes
          - --kubeconfig
          - "{{ kubeconfig_path }}"
          - --name
          - "{{ cluster_name }}"
          - --label
          - cluster-type=workload
          - --yes