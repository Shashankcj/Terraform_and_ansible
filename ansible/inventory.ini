
# ==========================

# All Control Planes

# ==========================

[control_plane:children]
cluster1_control_plane
cluster2_control_plane

# ==========================

# All Workers

# ==========================

[workers:children]
cluster1_workers
cluster2_workers

# ==========================

# Kubernetes Cluster 1

# ==========================

[cluster1_control_plane]
k8s-cluster-1-cp-1 ansible_host=10.99.1.131

[cluster1_workers]
k8s-cluster-1-worker-1 ansible_host=10.99.1.134
k8s-cluster-1-worker-2 ansible_host=10.99.1.129

[cluster1:children]
cluster1_control_plane
cluster1_workers

[cluster1:vars]
kube_vip=10.99.1.249
control_plane_host=k8s-cluster-1-cp-1
pod_network_cidr=10.244.0.0/16
service_network_cidr=10.96.0.0/16

# ==========================

# Kubernetes Cluster 2

# ==========================

[cluster2_control_plane]
k8s-cluster-2-cp-1 ansible_host=10.99.1.128

[cluster2_workers]
k8s-cluster-2-worker-1 ansible_host=10.99.1.135
k8s-cluster-2-worker-2 ansible_host=10.99.1.124

[cluster2:children]
cluster2_control_plane
cluster2_workers

[cluster2:vars]
kube_vip=10.99.1.250
control_plane_host=k8s-cluster-2-cp-1
pod_network_cidr=10.245.0.0/16
service_network_cidr=10.97.0.0/16

# ==========================

# Ansible Configuration

# ==========================

[all:vars]
ansible_user=admin1
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

