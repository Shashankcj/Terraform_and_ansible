[control_plane]
k8s-cp-1 ansible_host=10.99.1.116

[workers]
k8s-worker-1 ansible_host=10.99.1.119
k8s-worker-2 ansible_host=10.99.1.106

[kubernetes:children]
control_plane
workers

[kubernetes:vars]
ansible_user=admin1
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
